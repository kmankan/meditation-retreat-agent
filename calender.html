<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 10px 20px 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #333;
            margin: 10px 0 20px;
        }
        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .day {
            border: 1px solid #e0e0e0;
            padding: 10px;
            min-height: 120px;
            position: relative;
            background-color: #fff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .day:hover {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .day-number {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }
        .event {
            background-color: #e0f0ff;
            border-radius: 3px;
            padding: 4px 8px;
            margin-bottom: 5px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .event:hover {
            background-color: #c0e0ff;
        }
        .month-year {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        .nav-buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        @media (max-width: 768px) {
            #calendar {
                grid-template-columns: repeat(1, 1fr);
            }
            .day {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <h1>Actually Good Meditation Retreats</h1>
    <div class="nav-buttons">
        <button id="prevMonth">Previous Month</button>
        <button id="nextMonth">Next Month</button>
    </div>
    <div id="monthYear" class="month-year"></div>
    <div id="calendar"></div>

    <script>
        let events = [];
        let currentDate = new Date();

        function fetchEvents() {
            fetch('src/retreat-information/all-retreats.json')
                .then(response => response.json())
                .then(data => {
                    events = data;
                    renderCalendar();
                })
                .catch(error => console.error('Error fetching events:', error));
        }

        function renderCalendar() {
            const calendarEl = document.getElementById('calendar');
            const monthYearEl = document.getElementById('monthYear');
            calendarEl.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            for (let i = 0; i < firstDay.getDay(); i++) {
                calendarEl.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.innerHTML = `<div class="day-number">${day}</div>`;

                const currentDay = new Date(year, month, day);
                events.forEach(event => {
                    const startDate = new Date(event['start-date']);
                    const endDate = new Date(event['end-date']);
                    if (currentDay >= startDate && currentDay <= endDate) {
                        const eventEl = document.createElement('div');
                        eventEl.classList.add('event');
                        eventEl.textContent = event.title;
                        eventEl.title = `${event.title}\nLocation: ${event.location}\nDates: ${event['start-date']} to ${event['end-date']}`;
                        eventEl.onclick = () => window.open(event.url, '_blank');
                        dayEl.appendChild(eventEl);
                    }
                });

                calendarEl.appendChild(dayEl);
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        fetchEvents();
    </script>
</body>
</html>
